<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ebe8e4"/>
      <stop offset="55%" stop-color="#f5f3f1"/>
      <stop offset="100%" stop-color="#fdfcfc"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c4b0"/>
      <stop offset="45%" stop-color="#cbb79e"/>
      <stop offset="100%" stop-color="#bda888"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#fdfcfc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fdfcfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1240" cy="180" r="220" fill="url(#sun)"/>

  <!-- Clay court plane -->
  <path d="M-40 380 L1640 300 L1640 1000 L-40 1000 Z" fill="url(#clay)"/>
  <path d="M-40 380 L1640 300 L1640 340 L-40 420 Z" fill="#000" opacity="0.06"/>

  <!-- Court lines (perspective) -->
  <g stroke="#fdfcfc" stroke-opacity="0.88" fill="none">
    <path d="M220 880 L480 470 L1120 440 L1380 840 Z" stroke-width="3"/>
    <path d="M350 820 L560 520 L1040 495 L1250 790 Z" stroke-width="2"/>
    <path d="M800 455 L800 860" stroke-width="2.5" stroke="#ea1c2c" stroke-opacity="0.9"/>
    <path d="M560 520 L1040 495" stroke-width="2"/>
    <path d="M480 470 L1120 440" stroke-width="2.5"/>
    <path d="M420 700 L1180 670" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="800" cy="680" r="36" stroke-width="2" stroke-opacity="0.55"/>
  </g>

  <!-- Soft net suggestion -->
  <path d="M470 468 L1130 438" stroke="#000" stroke-opacity="0.18" stroke-width="6"/>
  <path d="M470 468 L1130 438" stroke="#fdfcfc" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
